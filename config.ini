; Colorscheme
[colors]
bg0 = #060606
bg1 = #282828
bg2 = #3c3c3c
fg0 = #e1e1e1
muted = #7c7c7c
border = #525252
semi-trans = #00000000

; Theme
include-directory = ${env:POLYBAR_COLLECTION}/themes/murz

[bar/main]
width = 100%
height = 30

bottom = true
fixed-center = true

offset-x = 0
offset-y = 0

background = ${colors.bg0}
foreground = ${colors.fg0}

; Options: bspwm, i3
wm-restack = bspwm

; Font file
include-file = fonts.ini

; Set enabled modules
include-file = ${env:POLYBAR_COLLECTION}/enabled-modules.ini
